name: Feature request (user-facing)
description: Request a new feature or improvement without technical details
title: "Feature request: "
labels:
  - enhancement
  - user-request
  - type:feature

body:
  - type: markdown
    attributes:
      value: |
        **Issue type:** Feature

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: |
        Describe the goal or task you are trying to accomplish.
        Focus on what you want to achieve, not how it should be implemented.
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: |
        Explain what is currently difficult, confusing, slow, or impossible.
        If something is frustrating, describe why.
      placeholder: "Right now it's hard because..."
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What would a good solution look like to you?
      description: |
        In your own words, describe what success looks like.
        This can be a behavior, outcome, or experience — not technical details.
      placeholder: "It would be great if..."
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: Who would this help?
      options:
        - Just me
        - My team
        - Many users
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this?
      options:
        - Nice to have
        - Important
        - Blocking my work
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: |
        Include anything else that may help:
        - Screenshots
        - Examples
        - Links
        - Current workarounds
      placeholder: "Add links, screenshots, examples, or workarounds..."
    validations:
      required: false