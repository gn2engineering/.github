name: Feature request (user-facing)
description: Request a new feature or improvement without technical details
title: "Feature request: "
labels:
  - enhancement
  - user-request
  - type: Feature

body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      description: What kind of request is this?
      options:
        - Feature request (new capability)
        - Improvement (make something better)
        - UI/UX change
        - Documentation / guidance
        - Other
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the goal or task you are trying to accomplish. Focus on what you want to achieve, not how it should be implemented.
      placeholder: "I want to be able to…"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: Explain what is currently difficult, confusing, slow, or impossible. If something is frustrating, describe why.
      placeholder: "Right now it’s hard because…"
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What would a good solution look like to you?
      description: In your own words, describe what success looks like (behavior/outcome/experience — not technical details).
      placeholder: "It would be great if…"
    validations:
      required: true

  - type: dropdown
    id: who_helped
    attributes:
      label: Who would this help?
      options:
        - Just me
        - My team
        - Many users
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this?
      options:
        - Nice to have
        - Important
        - Blocking my work
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context (optional)
      description: Include anything else that may help (screenshots, examples, links, current workarounds).
      placeholder: "Links, screenshots, examples, workarounds…"
    validations:
      required: false